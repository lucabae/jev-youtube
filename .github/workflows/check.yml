name: check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: js
        run: for f in src/*.js; do node --check "$f"; done
      - name: manifest
        run: node -e "JSON.parse(require('fs').readFileSync('manifest.json','utf8'))"
