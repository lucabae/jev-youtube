name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: zip de la extensión
        run: |
          mkdir -p dist
          zip -r "dist/jev-youtube-${{ github.ref_name }}.zip" manifest.json src icons
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          generate_release_notes: true
